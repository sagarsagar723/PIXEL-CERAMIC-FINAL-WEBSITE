<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Ceramic - 3D Anti-Gravity Preloader</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0b0d12;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
}

#site-preloader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: #0b0e14;
    overflow: hidden;
    transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.75s;
    will-change: opacity, transform;
}

#site-preloader.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#preloader-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

.preloader-ui {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(24px, 5vh, 48px) 24px;
    pointer-events: none;
    z-index: 2;
    transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
}

#site-preloader.push-through .preloader-ui {
    transform: scale(1.12);
    opacity: 0;
}

.preloader-brand {
    text-align: center;
    opacity: 0;
    transform: translateY(-14px);
    animation: preloaderIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}

.preloader-logo {
    max-width: 250px;
    width: 70vw;
    height: auto;
    filter: drop-shadow(0 0 25px rgba(197, 168, 128, 0.4)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
}

.preloader-subline {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #a8a096;
    margin-top: 10px;
}

.preloader-bottom {
    width: 100%;
    max-width: 440px;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: preloaderIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

.preloader-progress-track {
    width: 100%;
    height: 2.5px;
    background: rgba(255, 255, 255, 0.08);
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
    border-radius: 99px;
}

.preloader-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8c6f48, #c5a880 70%, #fff0d4);
    box-shadow: 0 0 14px rgba(197, 168, 128, 0.9);
    border-radius: 99px;
    transition: width 0.08s linear;
}

.preloader-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    font-family: 'Montserrat', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8c857e;
}

.preloader-percent-num {
    font-weight: 700;
    color: #c5a880;
    font-variant-numeric: tabular-nums;
}

@keyframes preloaderIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
<script src="assets/three.min.js"></script>
</head>
<body>

<div id="site-preloader">
    <canvas id="preloader-canvas"></canvas>
    
    <div class="preloader-ui">
        <div class="preloader-brand">
            <img src="assets/logo.svg" alt="Pixel Ceramic" class="preloader-logo">
            <div class="preloader-subline">Architectural Surfaces &bull; Morbi, India</div>
        </div>
        
        <div class="preloader-bottom">
            <div class="preloader-progress-track">
                <div class="preloader-progress-fill" id="preloaderFill"></div>
            </div>
            <div class="preloader-status-row">
                <span id="preloaderStatus">Zero-G Polarization</span>
                <span class="preloader-percent-num" id="preloaderPercent">0%</span>
            </div>
        </div>
    </div>
</div>

<main style="padding: 120px 24px; text-align: center;">
    <h1 style="font-size: 2.5rem; margin-bottom: 16px;">Pixel Ceramic</h1>
    <p style="color: #aaa;">Engineered Porcelain Surfaces for Global Architecture.</p>
</main>

<script>
(function() {
    const preloader = document.getElementById('site-preloader');
    const canvas = document.getElementById('preloader-canvas');
    const fillBar = document.getElementById('preloaderFill');
    const percentEl = document.getElementById('preloaderPercent');
    const statusEl = document.getElementById('preloaderStatus');

    if (!preloader || !canvas || typeof THREE === 'undefined') return;

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.0016);

    const isMobile = window.innerWidth < 640;
    const initialCamZ = isMobile ? 540 : 420;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.set(0, 0, initialCamZ);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0b0e14, 1);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const goldSpot = new THREE.PointLight(0xc5a880, 3.2, 900);
    goldSpot.position.set(0, 40, 280);
    scene.add(goldSpot);

    const rimLight = new THREE.DirectionalLight(0xa5b4fc, 1.4);
    rimLight.position.set(-220, 260, -120);
    scene.add(rimLight);

    const fillWarm = new THREE.DirectionalLight(0xffe0b2, 0.8);
    fillWarm.position.set(220, -180, 160);
    scene.add(fillWarm);

    // 20 Porcelain Mosaic Pieces (5 columns x 4 rows)
    const COLS = 5;
    const ROWS = 4;
    const TILE_W = isMobile ? 42 : 56;
    const TILE_H = isMobile ? 32 : 44;
    const TILE_D = 4;
    const GAP = 3.0;

    const totalGridW = (COLS * TILE_W) + ((COLS - 1) * GAP);
    const totalGridH = (ROWS * TILE_H) + ((ROWS - 1) * GAP);
    const originX = -totalGridW / 2 + TILE_W / 2;
    const originY = totalGridH / 2 - TILE_H / 2;

    // Procedural luxury porcelain textures
    function createTileTexture(type, id) {
        const cv = document.createElement('canvas');
        cv.width = 512;
        cv.height = 512;
        const ctx = cv.getContext('2d');

        if (type === 'calacatta') {
            // White Calacatta Marble with gold & gray veins
            ctx.fillStyle = '#f7f6f2';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = 'rgba(175, 165, 155, 0.38)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(0, (id * 97) % 512);
            ctx.bezierCurveTo(180, 200, 320, 80, 512, (id * 143) % 512);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(197, 168, 128, 0.55)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, (id * 97 + 10) % 512);
            ctx.bezierCurveTo(170, 210, 310, 90, 512, (id * 143 + 12) % 512);
            ctx.stroke();
        } else if (type === 'nero') {
            // Nero Marquina Dark Onyx
            ctx.fillStyle = '#14171d';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo((id * 83) % 512, 0);
            ctx.lineTo(512 - ((id * 41) % 512), 512);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(197, 168, 128, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        } else if (type === 'emerald') {
            // Emerald Green Architectural Surface
            ctx.fillStyle = '#172722';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = 'rgba(197, 168, 128, 0.5)';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(256, 256, 160 + (id % 4) * 20, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // Warm Travertine Sand
            ctx.fillStyle = '#dfd6c8';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = 'rgba(160, 140, 120, 0.35)';
            ctx.lineWidth = 4;
            for (let l = 60; l < 512; l += 80) {
                ctx.beginPath();
                ctx.moveTo(0, l);
                ctx.lineTo(512, l + 20);
                ctx.stroke();
            }
        }

        // Rectified tile micro-bevel frame
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, 512, 512);

        ctx.strokeStyle = 'rgba(197, 168, 128, 0.5)';
        ctx.lineWidth = 3;
        ctx.strokeRect(6, 6, 500, 500);

        return new THREE.CanvasTexture(cv);
    }

    const pieces = [];
    const geom = new THREE.BoxGeometry(TILE_W, TILE_H, TILE_D);

    const surfaceTypes = ['calacatta', 'nero', 'calacatta', 'emerald', 'travertine'];

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const idx = r * COLS + c;
            const targetX = originX + c * (TILE_W + GAP);
            const targetY = originY - r * (TILE_H + GAP);
            const targetZ = 0;

            const stype = surfaceTypes[(r * 2 + c) % surfaceTypes.length];
            const tex = createTileTexture(stype, idx);

            const mat = new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.14,
                metalness: 0.28,
                emissive: 0xc5a880,
                emissiveIntensity: 0.04
            });

            const mesh = new THREE.Mesh(geom, mat);

            // Zero-G scattered coordinates
            const seed = (idx + 1) * 37.3;
            const initX = (Math.sin(seed) * 270) + (c - 2) * 55;
            const initY = (Math.cos(seed * 1.4) * 195) + (r - 1.5) * 50;
            const initZ = (Math.sin(seed * 2.2) * 230) - 30;

            mesh.position.set(initX, initY, initZ);
            mesh.rotation.set(
                Math.sin(seed * 0.8) * Math.PI,
                Math.cos(seed * 1.1) * Math.PI,
                Math.sin(seed * 1.7) * Math.PI * 2
            );

            scene.add(mesh);

            pieces.push({
                mesh: mesh,
                target: new THREE.Vector3(targetX, targetY, targetZ),
                initPos: new THREE.Vector3(initX, initY, initZ),
                initRot: mesh.rotation.clone(),
                driftSpeed: 0.75 + (idx % 6) * 0.22,
                driftOffset: idx * 1.15,
                locked: false,
                bounceTime: 0
            });
        }
    }

    // Glowing grout background grid
    const gridBackGeom = new THREE.PlaneGeometry(totalGridW + 16, totalGridH + 16);
    const gridBackMat = new THREE.MeshBasicMaterial({
        color: 0xc5a880,
        transparent: true,
        opacity: 0
    });
    const gridBack = new THREE.Mesh(gridBackGeom, gridBackMat);
    gridBack.position.z = -2.2;
    scene.add(gridBack);

    // Floating zero-G micro particles
    const particleCount = 140;
    const particleGeom = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
        particlePos[i] = (Math.random() - 0.5) * 800;
        particlePos[i + 1] = (Math.random() - 0.5) * 600;
        particlePos[i + 2] = (Math.random() - 0.5) * 600;
    }
    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
        color: 0xc5a880,
        size: 2.0,
        transparent: true,
        opacity: 0.38
    });
    const particles = new THREE.Points(particleGeom, particleMat);
    scene.add(particles);

    // Animation & Physics Engine Controller
    let progress = 0;
    let pageReady = false;
    let isLocked = false;
    let pushThroughActive = false;
    const startTime = performance.now();
    let lastTime = performance.now();

    function onPageLoaded() { pageReady = true; }
    if (document.readyState === 'complete') onPageLoaded();
    else window.addEventListener('load', onPageLoaded);
    setTimeout(onPageLoaded, 2200); // 2.2s maximum failsafe

    function render(now) {
        const delta = Math.min((now - lastTime) * 0.001, 0.1);
        lastTime = now;
        const elapsed = (now - startTime) * 0.001;

        // Progress Acceleration Curve
        if (!pageReady) {
            if (progress < 85) {
                progress += (85 - progress) * 0.048 + 0.32;
            }
        } else {
            progress += (100 - progress) * 0.18 + 1.8;
        }

        if (progress > 100) progress = 100;
        const pNorm = progress / 100;

        // Telemetry Update
        const floorP = Math.floor(progress);
        if (fillBar) fillBar.style.width = floorP + '%';
        if (percentEl) percentEl.textContent = floorP + '%';

        if (pNorm < 0.35) {
            if (statusEl) statusEl.textContent = 'Zero-G Anti-Gravity Field';
        } else if (pNorm < 0.88) {
            if (statusEl) statusEl.textContent = 'Inverse Magnetic Polarization';
        } else if (pNorm < 1) {
            if (statusEl) statusEl.textContent = 'Tessellation Convergence';
        } else {
            if (statusEl) statusEl.textContent = 'Tessellation Locked';
        }

        // Inverse Magnetic Attraction Force
        const magneticPull = Math.pow(pNorm, 2.75);

        pieces.forEach(p => {
            const mesh = p.mesh;

            if (pNorm < 0.98) {
                // Zero-G Harmonic Floating & Z-axis drift
                const driftX = Math.sin(elapsed * p.driftSpeed + p.driftOffset) * (1 - magneticPull) * 16;
                const driftY = Math.cos(elapsed * (p.driftSpeed * 1.1) + p.driftOffset) * (1 - magneticPull) * 14;
                const driftZ = Math.sin(elapsed * 0.95 + p.driftOffset) * (1 - magneticPull) * 20;

                mesh.position.x = THREE.MathUtils.lerp(p.initPos.x + driftX, p.target.x, magneticPull);
                mesh.position.y = THREE.MathUtils.lerp(p.initPos.y + driftY, p.target.y, magneticPull);
                mesh.position.z = THREE.MathUtils.lerp(p.initPos.z + driftZ, p.target.z, magneticPull);

                mesh.rotation.x = THREE.MathUtils.lerp(p.initRot.x + (elapsed * 0.5 * (1 - magneticPull)), 0, magneticPull);
                mesh.rotation.y = THREE.MathUtils.lerp(p.initRot.y + (elapsed * 0.6 * (1 - magneticPull)), 0, magneticPull);
                mesh.rotation.z = THREE.MathUtils.lerp(p.initRot.z + (elapsed * 0.8 * (1 - magneticPull)), 0, magneticPull);
            } else {
                // SATISFYING ZERO-DAMPING BOUNCE WHEN SNAPPING
                if (!p.locked) {
                    p.locked = true;
                    p.bounceTime = 0;
                }

                p.bounceTime += delta;
                // High-frequency undamped spring harmonic bounce along Z-axis:
                // z = A * cos(omega * t) * exp(-zeta * t)
                const omega = 40.0;
                const zeta = 3.2; // crisp tactile snap
                const bounceAmp = 13.0;
                const bounceOffset = bounceAmp * Math.cos(omega * p.bounceTime) * Math.exp(-zeta * p.bounceTime);

                mesh.position.set(p.target.x, p.target.y, p.target.z + (p.bounceTime < 0.85 ? bounceOffset : 0));
                mesh.rotation.set(0, 0, 0);
            }
        });

        // Specular gold energy flash when locked
        if (pNorm >= 0.98) {
            if (!isLocked) {
                isLocked = true;
                goldSpot.intensity = 6.0; // intense flash highlight
            }
            gridBackMat.opacity = Math.min(gridBackMat.opacity + delta * 2.8, 0.9);
            goldSpot.intensity = THREE.MathUtils.lerp(goldSpot.intensity, 3.2, 0.06);
        }

        // Gentle camera sway before push-through
        if (!pushThroughActive) {
            camera.position.x = Math.sin(elapsed * 0.45) * (1 - pNorm) * 22;
            camera.position.y = Math.cos(elapsed * 0.55) * (1 - pNorm) * 16;
            camera.lookAt(0, 0, 0);
        }

        // FAST CAMERA PUSH-THROUGH TRANSITION
        if (pNorm >= 1.0 && !pushThroughActive) {
            pushThroughActive = true;
            setTimeout(() => {
                preloader.classList.add('push-through');
                const pushStart = performance.now();
                const startCamZ = camera.position.z;

                function pushLoop(t) {
                    const progressT = Math.min((t - pushStart) / 600, 1.0); // 600ms high-speed plunge
                    const eased = Math.pow(progressT, 2.6); // cubic-accelerated push

                    camera.position.z = THREE.MathUtils.lerp(startCamZ, -260, eased);

                    if (progressT > 0.45) {
                        preloader.classList.add('fade-out');
                    }

                    if (progressT < 1.0) {
                        requestAnimationFrame(pushLoop);
                    } else {
                        setTimeout(() => {
                            preloader.style.display = 'none';
                            renderer.dispose();
                        }, 250);
                    }
                }
                requestAnimationFrame(pushLoop);
            }, 320); // hold for 320ms to savor the finished locked mosaic
        }

        renderer.render(scene, camera);

        if (!preloader.classList.contains('fade-out')) {
            requestAnimationFrame(render);
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(render);
})();
</script>
</body>
</html>
